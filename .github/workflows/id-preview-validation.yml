name: International Days preview validation

on:
  push:
    branches:
      - main
      - preview/international-days-2026
    paths:
      - 'id/**'
      - '.github/workflows/id-preview-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'id/**'

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and JSON
        run: |
          node --check id/assets/calendar.js
          node --check id/assets/calendar-dates.mjs
          node --check id/assets/activities.js
          node --check id/tests/browser-smoke.mjs
          node --check id/tests/calendar-dates.mjs
          node id/tests/calendar-dates.mjs
          node -e "const e=require('./id/data/events.json'); const a=require('./id/data/activities.json'); if(!e.events.length||!Array.isArray(a.activities))process.exit(1)"
      - name: Verify noindex and no ad scripts
        run: |
          grep -q 'name="robots" content="noindex,follow"' id/index.html
          grep -q 'name="robots" content="noindex,follow"' id/en/index.html
          grep -q 'name="robots" content="noindex,follow"' id/irbis/index.html
          ! grep -Ei 'googlesyndication|adsbygoogle|googletagmanager' id/index.html id/en/index.html id/irbis/index.html
      - name: Install isolated browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Serve static files
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/id-preview-server.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/id/ >/dev/null
      - name: Browser smoke tests desktop, tablet and mobile
        run: node id/tests/browser-smoke.mjs
