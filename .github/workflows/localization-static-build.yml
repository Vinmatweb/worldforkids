name: Localization static build

on:
  push:
    branches:
      - de-es-localization
  workflow_dispatch:

concurrency:
  group: localization-static-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip localization build]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out localization branch
        uses: actions/checkout@v4
        with:
          ref: de-es-localization
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run, validate and record localization build
        shell: bash
        run: |
          set +e
          REPORT="localization-build-report.txt"
          : > "$REPORT"
          FAILED=0

          run_step() {
            NAME="$1"
            shift
            echo "## $NAME" | tee -a "$REPORT"
            "$@" >> "$REPORT" 2>&1
            STATUS=$?
            echo "Exit code: $STATUS" | tee -a "$REPORT"
            echo "" >> "$REPORT"
            if [ "$STATUS" -ne 0 ]; then
              FAILED=1
            fi
          }

          run_step "Check build scripts" bash -lc '
            node --check scripts/optimize-localized-index-seo.mjs &&
            node --check scripts/polish-activity-localization.mjs &&
            node --check scripts/polish-de-es-content.mjs &&
            node --check scripts/build-static-site.mjs &&
            node --check scripts/finalize-activity-pages.mjs &&
            node --check scripts/normalize-guide-headers.mjs &&
            node --check scripts/finalize-localized-indexes.mjs &&
            node --check scripts/validate-localized-site.mjs &&
            node --check scripts/validate-difficulty-localization.mjs &&
            node --check scripts/validate-de-es-content.mjs &&
            node --check assets/js/site-config.js &&
            node --check assets/js/site-navigation.js'

          if [ "$FAILED" -eq 0 ]; then run_step "Optimize localized index SEO" node scripts/optimize-localized-index-seo.mjs; fi
          if [ "$FAILED" -eq 0 ]; then run_step "Polish activity metadata" node scripts/polish-activity-localization.mjs; fi
          if [ "$FAILED" -eq 0 ]; then run_step "Polish DE ES content" node scripts/polish-de-es-content.mjs; fi
          if [ "$FAILED" -eq 0 ]; then run_step "Generate localized static site" node scripts/build-static-site.mjs; fi
          if [ "$FAILED" -eq 0 ]; then run_step "Finalize generated activity pages" node scripts/finalize-activity-pages.mjs; fi
          if [ "$FAILED" -eq 0 ]; then run_step "Normalize guide headers" node scripts/normalize-guide-headers.mjs; fi
          if [ "$FAILED" -eq 0 ]; then run_step "Finalize localized indexes" node scripts/finalize-localized-indexes.mjs; fi
          if [ "$FAILED" -eq 0 ]; then run_step "Validate base localization" node scripts/validate-localized-site.mjs; fi
          if [ "$FAILED" -eq 0 ]; then run_step "Validate difficulty pages" node scripts/validate-difficulty-localization.mjs; fi
          if [ "$FAILED" -eq 0 ]; then run_step "Validate complete DE ES content" node scripts/validate-de-es-content.mjs; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$FAILED" -ne 0 ]; then
            echo "BUILD RESULT: FAILED" >> "$REPORT"
            git add "$REPORT"
            git commit -m "Add localization build report [skip localization build]"
            git push origin HEAD:de-es-localization
            exit 0
          fi

          echo "BUILD RESULT: PASSED" >> "$REPORT"
          git add assets/data scripts/build-static-site.mjs index.html cs/index.html de/index.html es/index.html sitemap.xml activities cs/aktivity de/aktivitaeten es/actividades guide-*.html history-tracing.html difficulty-levels.html our-story.html privacy.html terms.html cs/*.html de/*.html es/*.html "$REPORT"

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "Build localized static pages [skip localization build]"
          git push origin HEAD:de-es-localization
