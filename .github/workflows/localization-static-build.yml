name: Localization static build

on:
  push:
    branches:
      - de-es-localization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip localization build]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out localization branch
        uses: actions/checkout@v4
        with:
          ref: de-es-localization
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare generator
        run: node scripts/prepare-localization-build.mjs

      - name: Generate localized static site
        run: node scripts/build-static-site.mjs

      - name: Commit generated files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-static-site.mjs index.html cs/index.html de/index.html es/index.html sitemap.xml activities cs/aktivity de/aktivitaeten es/actividades guide-*.html history-tracing.html difficulty-levels.html our-story.html privacy.html terms.html cs/*.html de/*.html es/*.html
          git commit -m "Build localized static pages [skip localization build]"
          git push origin HEAD:de-es-localization
