<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet"><title>VinMat – Mega Balíčky | Interní plán</title><style>body{margin:0;background:#0e1117;color:#f0f3f6;font-family:system-ui,sans-serif;padding:32px}.loading{max-width:900px;margin:auto;color:#9da7b3}</style></head><body><div class="loading">Načítám interní plán Mega Balíčků…</div><script>(async()=>{const src='https://cdn.jsdelivr.net/gh/Vinmatweb/worldforkids@a72125eadddda63ca5924ee5fec1b87bdbf3396b/mega-bundles-plan.html';try{let h=await (await fetch(src,{cache:'no-store'})).text();const patch=`<style>.workitems{margin:0;padding:2px 16px 13px 34px}.workitems li{padding:5px 0;line-height:1.42;color:#d9dee5}.wtag{display:inline-block;font-size:10px;font-weight:900;border-radius:999px;padding:2px 6px;margin-right:5px;color:#111}.wlv{background:#79c0ff}.wcore{background:#7ee787}.wbonus{background:#f2cc60}.s11hint{margin:8px 10px 12px;padding:10px 12px;border:1px dashed #d2a8ff;border-radius:10px;color:#c9d1d9;line-height:1.5}</style><script>(async()=>{document.querySelector('.lead').innerHTML='Interní dlouhodobý výrobní plán. Číslování: svět <b>S01, S02…</b>; Mega Balíček uvnitř světa <b>MB01, MB02…</b>; jednoznačný společný kód např. <b>S11MB01</b>.';document.querySelector('.note').innerHTML='<b>Pevná pravidla:</b> 1 svět = <b>2 až 6 Mega Balíčků</b>. 1 Mega Balíček = <b>přesně 5 hlavních motivů / skupin</b>. Každý motiv má minimálně <b>5 zdrojových omalovánek</b>; bohatší motiv může mít 6–15+ listů. <b>25 zdrojů je minimum MB, ne strop.</b>';document.querySelectorAll('.world').forEach((w,wi)=>{const sid='S'+String(wi+1).padStart(2,'0');const ws=w.querySelector(':scope>summary>span:first-child');ws.innerHTML='<span class="badge">'+sid+'</span>'+ws.textContent.replace(/^\\d{2} · /,'');w.querySelectorAll(':scope>.body>.bundle').forEach((b,bi)=>{const mb='MB'+String(bi+1).padStart(2,'0'),code=sid+mb,bs=b.querySelector(':scope>summary>span:first-child'),gid=bs.querySelector('.gid'),old=bs.querySelector('.badge');if(gid)gid.textContent=code;if(old)old.remove();const c=b.querySelector(':scope>summary>.count');if(c)c.textContent=mb+' · '+c.textContent.replace(/^.*?·\\s*/,'');});});try{const t=await (await fetch('/worldforkids/s11-master-plan.html',{cache:'no-store'})).text();const m=t.match(/const D=(\\{.*?\\});const app=/s);if(!m)throw new Error('S11 data nenalezena');const data=Function('return '+m[1])();const world=document.querySelectorAll('.world')[10];if(!world)throw new Error('S11 svět nenalezen');const bundles=world.querySelectorAll(':scope>.body>.bundle');Object.entries(data).forEach(([mbName,motifs],bi)=>{const bundle=bundles[bi];if(!bundle)return;const motifEls=bundle.querySelectorAll(':scope>.inside>.motif');Object.entries(motifs).forEach(([motif,items],mi)=>{const el=motifEls[mi];if(!el)return;const desc=el.querySelector('.desc');if(!desc)return;let ol='<ol class="workitems">';items.forEach(raw=>{const p=raw.split('|'),kind=(p[1]||'CORE').toLowerCase();ol+='<li><span class="wtag wlv">'+p[0]+'</span><span class="wtag w'+kind+'">'+p[1]+'</span>'+p.slice(2).join('|')+'</li>';});ol+='</ol>';desc.outerHTML=ol;});});const hint=document.createElement('div');hint.className='s11hint';hint.innerHTML='<b>S11 výrobní návaznost:</b> hlavní mapa → 4 Mega Balíčky → 5 motivů v každém MB → konkrétní Lv3 / Lv2 / Lv1 pracovní listy. Vše je nyní přímo v tomto jediném rozbalovacím stromu.';world.querySelector(':scope>.body').appendChild(hint);}catch(e){console.error(e);}})();<\/script>`;h=h.replace('</body>',patch+'</body>');document.open();document.write(h);document.close();}catch(e){document.querySelector('.loading').textContent='Interní plán se nepodařilo načíst. Obnov stránku prosím znovu.';}})();</script></body></html>
