<title id="title">Approximate smalltooth sawfish range and Czechia</title><desc id="desc">A simplified world map. Czechia is marked in Europe. A gold band shows the historical warm Atlantic range, while a teal marker highlights the known present-day concentration around southern Florida.</desc>
